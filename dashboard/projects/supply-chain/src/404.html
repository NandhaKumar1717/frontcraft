<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Supply Chain</title>
  <base href="/frontcraft/nexus-platform/supply-chain-tracker/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>
    // GitHub Pages SPA redirect for subdirectory
    var pathSegmentsToKeep = 3; // /frontcraft/nexus-platform/supply-chain-tracker
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, pathSegmentsToKeep + 1).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
