name: Deploy Micro Apps

on:
  push:
    branches: [ micro-apps ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs: 
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout portfolio-2 branch
        uses: actions/checkout@v4
        with:
          ref: portfolio-2
          submodules: false
          
      - name: Remove gitmodules from portfolio
        run: rm -f .gitmodules
          
      - name: Checkout micro-apps branch
        uses: actions/checkout@v4
        with:
          ref: micro-apps
          path: micro-apps
          submodules: false
          
      - name: Remove gitmodules from micro-apps
        run: rm -f micro-apps/.gitmodules
        
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Install dependencies
        working-directory: ./micro-apps/dashboard
        run: npm install --legacy-peer-deps
          
      - name: Build Dashboard
        working-directory: ./micro-apps/dashboard
        run: |
          npx ng build --configuration production --base-href="/frontcraft/nexus-platform/"
          cp ./dist/dashboard/index.html ./dist/dashboard/404.html
          
      - name: Build Supply Chain
        working-directory: ./micro-apps/dashboard
        run: |
          npx ng build supply-chain --configuration production --base-href="/frontcraft/nexus-platform/supply-chain-tracker/"
          cp ./dist/supply-chain/index.html ./dist/supply-chain/404.html
          
      - name: Prepare combined deployment
        run: |
          mkdir -p deploy
          # Copy portfolio files to root (excluding hidden files and micro-apps)
          find . -maxdepth 1 -type f -not -name '.*' -not -name 'micro-apps' -exec cp {} deploy/ \;
          find . -maxdepth 1 -type d -not -name '.' -not -name '.git' -not -name 'micro-apps' -exec cp -r {} deploy/ \;
          # Ensure index.html exists at root
          if [ ! -f deploy/index.html ]; then
            echo '<!DOCTYPE html><html><head><title>Portfolio</title></head><body><h1>Portfolio Site</h1></body></html>' > deploy/index.html
          fi
          # Copy dashboard
          mkdir -p deploy/nexus-platform
          cp -r ./micro-apps/dashboard/dist/dashboard/* deploy/nexus-platform/
          # Copy supply chain
          mkdir -p deploy/nexus-platform/supply-chain-tracker
          cp -r ./micro-apps/dashboard/dist/supply-chain/* deploy/nexus-platform/supply-chain-tracker/
          # List what we're deploying
          echo "Files being deployed:"
          ls -la deploy/
          echo "Nexus platform files:"
          ls -la deploy/nexus-platform/ || echo "No nexus-platform files"
          echo "Supply chain files:"
          ls -la deploy/nexus-platform/supply-chain-tracker/ || echo "No supply-chain files"
          
      - name: Deploy All Apps to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          publish_branch: gh-pages
          keep_files: false