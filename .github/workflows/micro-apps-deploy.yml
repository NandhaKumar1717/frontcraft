name: Deploy Micro Apps

on:
  push:
    branches: [ micro-apps ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs: 
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
        
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json
          
      - name: Install dependencies
        working-directory: ./dashboard
        run: npm install --legacy-peer-deps
          
      - name: Build Dashboard
        working-directory: ./dashboard
        run: |
          npx ng build --configuration production --base-href="/frontcraft/nexus-platform/"
          cp ./dist/dashboard/index.html ./dist/dashboard/404.html
          
      - name: Build Supply Chain
        working-directory: ./dashboard
        run: |
          npx ng build supply-chain --configuration production --base-href="/frontcraft/nexus-platform/supply-chain-tracker/"
          cp ./dist/supply-chain/index.html ./dist/supply-chain/404.html
          
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Prepare deployment files
        run: |
          mkdir -p deploy/nexus-platform
          mkdir -p deploy/nexus-platform/supply-chain-tracker
          cp -r ./dashboard/dist/dashboard/* deploy/nexus-platform/
          cp -r ./dashboard/dist/supply-chain/* deploy/nexus-platform/supply-chain-tracker/
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./deploy
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4