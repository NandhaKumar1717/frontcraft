name: Deploy Portfolio + Dashboard

on:
  push:
    branches: [ micro-apps ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout portfolio-2 branch
        uses: actions/checkout@v4
        with:
          ref: portfolio-2
          
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          
      - name: Checkout micro-apps for dashboard
        uses: actions/checkout@v4
        with:
          ref: micro-apps
          path: micro-apps
          
      - name: Build Dashboard
        run: |
          cd micro-apps/dashboard
          npm install --legacy-peer-deps --force
          npm run build -- --configuration=production --base-href=/frontcraft/dashboard/
          
      - name: Build Supply Chain
        run: |
          cd micro-apps/dashboard
          npx ng build supply-chain --configuration production --base-href="/frontcraft/nexus-platform/supply-chain-tracker/"
          cp ./dist/supply-chain/index.html ./dist/supply-chain/404.html
          
      - name: Debug and prepare deployment
        run: |
          echo "=== Current directory contents ==="
          ls -la
          echo "=== Portfolio files ==="
          ls -la || true
          echo "=== Dashboard build ==="
          ls -la micro-apps/dashboard/dist/ || true
          
          mkdir -p deploy
          
          # Copy portfolio files (excluding directories we don't want)
          for item in *; do
            if [[ "$item" != "micro-apps" && "$item" != ".git" && "$item" != ".github" && "$item" != "deploy" ]]; then
              cp -r "$item" deploy/ 2>/dev/null || true
            fi
          done
          
          # Copy dashboard to subfolder
          if [ -d "micro-apps/dashboard/dist/dashboard" ]; then
            mkdir -p deploy/dashboard
            cp -r micro-apps/dashboard/dist/dashboard/* deploy/dashboard/
            echo "Dashboard copied successfully"
          else
            echo "ERROR: Dashboard build not found"
          fi
          
          # Copy supply-chain to nexus-platform subfolder
          if [ -d "micro-apps/dashboard/dist/supply-chain" ]; then
            mkdir -p deploy/nexus-platform/supply-chain-tracker
            cp -r micro-apps/dashboard/dist/supply-chain/* deploy/nexus-platform/supply-chain-tracker/
            echo "Supply-chain copied successfully"
          else
            echo "ERROR: Supply-chain build not found"
          fi
          
          echo "=== Final deploy directory ==="
          find deploy -type f | head -20
          
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./deploy
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4